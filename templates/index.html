<!DOCTYPE html>
<html>
<body>

<h1>Psychology Assistant</h1>

<textarea id="query" rows="5" cols="50"></textarea>

<br><br>

<button onclick="ask()">
Ask
</button>

<h3>Answer</h3>

<div id="answer"></div>

<script>

async function ask() {

    const query =
        document.getElementById("query").value;

    const response = await fetch(
        "/chat",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                query: query
            })
        }
    );

    const data = await response.json();

    document.getElementById("answer").innerText =
        data.answer;
}

</script>

</body>
</html>
